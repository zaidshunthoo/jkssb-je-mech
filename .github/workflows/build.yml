name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  website:
    name: Installable web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded zip
        run: |
          if [ ! -d www ]; then
            z=$(ls *.zip | head -1); echo "Unpacking $z"
            unzip -o -q "$z" -x '.github/*'
            if [ ! -d www ]; then d=$(dirname $(find . -name index.html -path '*www/*' | head -1)); cp -r "$d" www; fi
          fi
          ls -la www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
  android:
    name: Android installer (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded zip
        run: |
          if [ ! -d www ]; then
            z=$(ls *.zip | head -1); echo "Unpacking $z"
            unzip -o -q "$z" -x '.github/*'
            if [ ! -d www ]; then d=$(dirname $(find . -name index.html -path '*www/*' | head -1)); cp -r "$d" www; fi
          fi
          ls -la www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Use the app icon
        run: |
          for d in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            dir=android/app/src/main/res/${d%%:*}; size=${d##*:}
            convert www/icons/icon-512.png -resize ${size}x${size} $dir/ic_launcher.png
            convert www/icons/icon-512.png -resize ${size}x${size} $dir/ic_launcher_round.png
            convert www/icons/icon-512.png -resize ${size}x${size} $dir/ic_launcher_foreground.png
          done
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JKSSB-JE-Mech.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JKSSB-JE-Mech-APK
          path: JKSSB-JE-Mech.apk
